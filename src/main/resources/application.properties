spring.application.name=entry-payment-api
spring.profiles.default=local
server.servlet.context-path=/entry-payment
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
app.security.jwt.access-expiration=30m
app.security.jwt.refresh-expiration=30d
app.security.jwt.secret=${JWT_SECRET:change-this-development-key-to-at-least-32-characters}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
app.storage.customer-logo-directory=${CUSTOMER_LOGO_DIRECTORY:./uploads/customer-logos}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
